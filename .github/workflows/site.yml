name: Deploy site

# The repo is encrypted (git-crypt). This unlocks it, builds the
# obfuscated bundle (tools/site-build) and publishes only that to the
# Cloudflare Pages project behind tripleu.org. The readable source never ships.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - tools/site-build/**
      - .github/workflows/site.yml
      - .github/actions/unlock/**
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Unlock the source
        uses: ./.github/actions/unlock
        with:
          key: ${{ secrets.GIT_CRYPT_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build (obfuscate + minify)
        working-directory: tools/site-build
        env:
          # The prize for finding every secret is this key; the build injects it
          # into the bundle, where the obfuscator encodes it like any string.
          SITE_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      - name: Deploy to Cloudflare Pages
        env:
          # CLOUDFLARE_API_TOKEN: API token with Account > Cloudflare Pages > Edit,
          #   from the Cloudflare account that owns tripleu.org.
          # CLOUDFLARE_ACCOUNT_ID: that account's ID.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy .site-dist --project-name tripleu --branch main --commit-dirty=true
