name: Deploy site

# The repo is encrypted (git-crypt). This unlocks it, builds the
# obfuscated bundle (tools/site-build) and publishes only that to the
# Cloudflare Pages project behind tripleu.org. The readable source never ships.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - tools/site-build/**
      - .github/workflows/site.yml
      - .github/actions/unlock/**
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Unlock the source
        uses: ./.github/actions/unlock
        with:
          key: ${{ secrets.GIT_CRYPT_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build (obfuscate + minify)
        working-directory: tools/site-build
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      - name: Deploy to Cloudflare Pages
        env:
          # CLOUDFLARE_API_TOKEN: API token with Account > Cloudflare Pages > Edit,
          #   from the Cloudflare account that owns tripleu.org.
          # CLOUDFLARE_ACCOUNT_ID: that account's ID.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          # The secrets gate (functions/) hands out the key server-side; it reads it from here.
          printf '%s' "$SITE_KEY" | npx --yes wrangler@4 pages secret put SITE_KEY --project-name tripleu > /dev/null
          npx --yes wrangler@4 pages deploy .site-dist --project-name tripleu --branch main --commit-dirty=true

      - name: Delete older deployments
        # Pages keeps every past deployment live at its own *.pages.dev URL. Older
        # builds carried the source key in their JS, so only the newest one stays.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tripleu/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ids=""
          for page in $(seq 1 40); do
            got=$(curl -sf -H "$auth" "$api?per_page=25&page=$page" | jq -r '.result[].id')
            [ -z "$got" ] && break
            ids="$ids $got"
          done
          newest=$(echo $ids | awk '{print $1}')
          deleted=0
          for id in $ids; do
            [ "$id" = "$newest" ] && continue
            curl -sf -X DELETE -H "$auth" "$api/$id?force=true" > /dev/null && deleted=$((deleted + 1)) || echo "could not delete $id"
          done
          echo "kept $newest, deleted $deleted"

      - name: Purge the tripleu.org cache
        # JS is cached at the edge for 30 days; clear it so no old bundle lingers.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -s -H "$auth" "https://api.cloudflare.com/client/v4/zones?name=tripleu.org" | jq -r '.result[0].id // empty')
          [ -n "$zone" ] || { echo "token can't see the tripleu.org zone (needs Zone:Read + Cache Purge)"; exit 1; }
          curl -s -X POST -H "$auth" -H "content-type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" --data '{"purge_everything":true}' \
            | jq -e '.success' > /dev/null && echo "cache purged" || { echo "purge refused (token needs Cache Purge)"; exit 1; }
