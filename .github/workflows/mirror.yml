name: Snapshot Gitea

on:
  schedule:
    # Once a day. A day with nothing new in Gitea pushes nothing.
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mirror_gitea.py
      - .github/workflows/mirror.yml

# One sync at a time, and never cancel one halfway through a push: a newer
# trigger waits its turn instead.
concurrency:
  group: gitea-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # Gitea is only reachable over the tailnet, which this runner is on.
    runs-on: debiantripleu-ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mirror
        env:
          # GITEA_URL: the Gitea address as reachable from the runner (kept
          #   secret so the internal address stays out of this public repo).
          # GITEA_TOKEN: Gitea token with read:repository, from a site admin
          #   so every user's and org's repos are visible.
          # MIRROR_TOKEN: fine-grained GitHub PAT for TripleU613, all repos,
          #   with Administration and Contents read/write.
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: python3 scripts/mirror_gitea.py
